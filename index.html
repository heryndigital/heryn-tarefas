<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heryn Tarefas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0906; --bg-soft:#120d08;
    --surface:#1b140d; --surface-2:#241a10; --surface-3:#150f09;
    --border:rgba(246,238,222,.12); --border-strong:rgba(246,238,222,.20);
    --ink:#f6efe2; --ink-2:#d8cbb0; --ink-muted:#a99b80;
    --gold-100:#ffe7b8; --gold-300:#f7c463; --gold-500:#ec9f2e; --gold-700:#b96b12; --gold-900:#7a4308;
    --accent:var(--gold-500); --accent-2:var(--gold-300); --accent-ink:#1a1108;
    --accent-soft:rgba(236,159,46,.16);
    --gold-gradient: linear-gradient(120deg,var(--gold-300),var(--gold-500) 55%,var(--gold-700));
    --status-todo:#8f8168; --status-todo-bg:rgba(143,129,104,.18);
    --status-doing:#7fa3d9; --status-doing-bg:rgba(127,163,217,.16);
    --status-review:var(--gold-500); --status-review-bg:rgba(236,159,46,.16);
    --status-done:#5cc088; --status-done-bg:rgba(92,192,136,.16);
    --danger:#e2604a; --danger-bg:rgba(226,96,74,.16);
    --shadow: 0 20px 50px -22px rgba(0,0,0,.7), 0 4px 14px rgba(0,0,0,.4);
    --shadow-gold: 0 10px 30px -10px rgba(236,159,46,.45);
    --radius: 14px;
  }
  :root[data-theme="light"]{
    --bg:#faf6ec; --bg-soft:#f3ecdb;
    --surface:#ffffff; --surface-2:#f4eee0; --surface-3:#efe7d5;
    --border:rgba(36,26,16,.10); --border-strong:rgba(36,26,16,.18);
    --ink:#241a10; --ink-2:#4a3c28; --ink-muted:#8a7a5f;
    --gold-300:#b96b12;
    --accent-ink:#1a1108;
    --accent-soft:rgba(185,107,18,.13);
    --shadow: 0 16px 40px -20px rgba(60,40,10,.16), 0 3px 10px rgba(60,40,10,.06);
  }

  *{box-sizing:border-box;}
  [hidden]{ display:none !important; }
  body{
    margin:0; background:var(--bg); color:var(--ink); position:relative;
    font-family:"Manrope", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(246,238,222,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(246,238,222,.05) 1px, transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse 70% 46% at 50% 0%, #000 30%, transparent 82%);
    mask-image:radial-gradient(ellipse 70% 46% at 50% 0%, #000 30%, transparent 82%);
  }
  body::after{
    content:""; position:fixed; z-index:0; pointer-events:none;
    top:-280px; left:50%; transform:translateX(-50%);
    width:760px; height:520px; border-radius:999px; filter:blur(120px);
    background:radial-gradient(circle, rgba(236,159,46,.20), transparent 70%);
  }
  h1,h2,.display{ font-family:"Anton", ui-sans-serif, sans-serif; font-weight:400; text-transform:uppercase; letter-spacing:.01em; line-height:1; text-wrap:balance; }
  h3{ font-family:"Manrope",sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.08em; font-size:12px; color:var(--ink-muted); }
  .mono{ font-family:"Manrope", ui-sans-serif, sans-serif; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent-soft); }

  .app{ display:flex; flex-direction:column; min-height:100vh; position:relative; z-index:1; }

  .eyebrow{
    display:inline-flex; align-items:center; gap:.5rem;
    font-family:"Manrope",sans-serif; font-weight:700; font-size:11px;
    letter-spacing:.16em; text-transform:uppercase; color:var(--gold-300);
  }
  .eyebrow .dot{
    width:6px; height:6px; border-radius:999px; background:var(--gold-500); flex:none;
    box-shadow:0 0 0 0 rgba(236,159,46,.6); animation:pulse-dot 2.2s ease-out infinite;
  }
  @keyframes pulse-dot{
    0%{box-shadow:0 0 0 0 rgba(236,159,46,.55);}
    70%{box-shadow:0 0 0 8px rgba(236,159,46,0);}
    100%{box-shadow:0 0 0 0 rgba(236,159,46,0);}
  }
  .eyebrow-dot{
    width:6px; height:6px; border-radius:999px; background:var(--gold-500); flex:none;
    box-shadow:0 0 0 0 rgba(236,159,46,.6); animation:pulse-dot 2.2s ease-out infinite;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:12px;
    padding:12px 20px; background:rgba(11,9,6,.78); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:12px; margin-right:4px; }
  .brand-logo{ height:32px; width:auto; display:block; flex:none; }
  .brand-divider{ width:1px; height:20px; background:var(--border-strong); flex:none; }

  .seg{ display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:3px; gap:2px; }
  .seg button{
    border:none; background:transparent; color:var(--ink-muted); font-family:"Manrope",sans-serif; font-size:13px; font-weight:600;
    padding:7px 15px; border-radius:999px; cursor:pointer; transition:background .15s, color .15s;
  }
  .seg button.active{ background:var(--gold-gradient); color:var(--accent-ink); box-shadow:var(--shadow-gold); }

  .spacer{ flex:1; }

  .select, .input, .textarea{
    font-size:13px; color:var(--ink); background:var(--surface-2);
    border:1px solid var(--border-strong); border-radius:10px; padding:8px 11px;
    font-family:inherit;
  }
  .select option{ background:var(--surface-2); color:var(--ink); }
  .select:focus, .input:focus, .textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .textarea{ font-family:inherit; }
  ::placeholder{ color:var(--ink-muted); opacity:.75; }

  .btn{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--border-strong); background:var(--surface-2); color:var(--ink);
    font-family:"Manrope",sans-serif; font-size:13px; font-weight:600; padding:9px 16px; border-radius:999px; cursor:pointer;
    transition:transform .15s ease, background .15s, box-shadow .25s;
  }
  .btn:hover{ background:var(--surface); transform:translateY(-1px); }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--gold-gradient); color:var(--accent-ink); border-color:transparent; box-shadow:var(--shadow-gold); }
  .btn-primary:hover{ background:var(--gold-gradient); color:var(--accent-ink); transform:translateY(-2px); box-shadow:0 16px 40px -12px rgba(236,159,46,.6); }
  .btn-ghost{ border-color:var(--border-strong); background:rgba(246,238,222,.03); }
  .btn-ghost:hover{ background:rgba(246,238,222,.08); }
  .btn-danger{ color:var(--danger); border-color:var(--danger-bg); background:transparent; }
  .btn-danger:hover{ background:var(--danger-bg); }
  .btn-icon{ padding:8px; width:34px; height:34px; justify-content:center; }

  .avatar{
    width:26px; height:26px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; color:#1a1108; font-family:"Manrope",sans-serif;
  }
  .avatar-img{
    border-radius:50%; flex:none; object-fit:cover; display:block;
    box-shadow:0 0 0 1px var(--border-strong);
  }
  .who{ display:flex; align-items:center; gap:8px; border:1px solid var(--border-strong); background:var(--surface-2); border-radius:999px; padding:4px 12px 4px 4px; font-size:13px; }
  .who span.name{ font-weight:600; }


  /* ---------- Login ---------- */
  .login-screen{
    position:fixed; inset:0; z-index:300; display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .login-card{
    width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border-strong);
    border-radius:20px; padding:30px 26px; box-shadow:var(--shadow); text-align:center;
  }
  .login-logo{ height:42px; width:auto; margin:0 auto 14px; display:block; }
  .login-card .eyebrow{ justify-content:center; margin-bottom:18px; }
  .login-card h2{ font-size:21px; margin:0 0 18px; }
  .login-card .field{ text-align:left; }
  .login-error{
    font-size:12.5px; color:var(--danger); background:var(--danger-bg); border-radius:8px;
    padding:8px 10px; margin-bottom:13px; text-align:left;
  }
  .btn-logout{ font-size:12px; padding:7px 13px; }

  /* ---------- Main layout ---------- */
  .main{ flex:1; display:flex; min-height:0; }
  .content{ flex:1; min-width:0; padding:20px 20px 40px; }

  .toolbar{ display:flex; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .toolbar .title{ font-family:"Anton",sans-serif; font-weight:400; text-transform:uppercase; letter-spacing:.01em; font-size:26px; margin-right:4px; color:var(--ink); }
  .count-pill{ font-size:12px; color:var(--ink-muted); background:var(--surface-2); border:1px solid var(--border-strong); padding:3px 10px; border-radius:999px; }

  /* ---------- Kanban ---------- */
  .board{ display:flex; gap:14px; overflow-x:auto; padding-bottom:10px; align-items:flex-start; }
  .column{
    background:var(--surface-3); border:1px solid var(--border); border-radius:16px; padding:11px; width:280px; flex:none;
    display:flex; flex-direction:column; gap:9px; min-height:120px;
  }
  .column.dragover{ outline:2px dashed var(--accent); outline-offset:-4px; }
  .column-head{ display:flex; align-items:center; gap:8px; padding:4px 6px 2px; }
  .status-dot{ width:8px; height:8px; border-radius:50%; flex:none; box-shadow:0 0 8px 0 currentColor; }
  .column-title{ font-family:"Manrope",sans-serif; font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-2); }
  .column-count{ margin-left:auto; font-size:12px; color:var(--ink-muted); }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:12px 13px; box-shadow:var(--shadow); cursor:grab; display:flex; flex-direction:column; gap:9px;
    transition:border-color .15s, transform .15s;
  }
  .card:hover{ border-color:var(--border-strong); }
  .card:active{ cursor:grabbing; }
  .card.overdue{ border-left:3px solid var(--danger); }
  .card-tag{
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    color:var(--gold-300); background:var(--accent-soft); border:1px solid rgba(236,159,46,.28);
    padding:3px 9px; border-radius:999px; align-self:flex-start;
  }
  .card-title{ font-size:13.5px; font-weight:500; line-height:1.4; color:var(--ink); }
  .card-foot{ display:flex; align-items:center; gap:8px; }
  .card-due{ font-size:11px; color:var(--ink-muted); display:flex; align-items:center; gap:4px; }
  .card-due.overdue{ color:var(--danger); font-weight:700; }
  .prio-dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .card-foot .spacer{ flex:1; }
  .card-move{ font-size:11px; border:1px solid var(--border-strong); background:var(--surface-2); border-radius:7px; padding:3px 6px; color:var(--ink-2); cursor:pointer; }

  .empty-col{ border:1.5px dashed var(--border-strong); border-radius:10px; padding:18px 10px; text-align:center; color:var(--ink-muted); font-size:12px; }

  /* ---------- Calendar ---------- */
  .cal-wrap{ display:flex; gap:16px; align-items:flex-start; }
  .cal-main{ flex:1; min-width:0; }
  .cal-nav{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .cal-nav .label{ font-family:"Manrope",sans-serif; font-weight:700; font-size:15px; min-width:160px; color:var(--ink); }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cal-dow{ font-size:11px; color:var(--ink-muted); text-align:center; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding-bottom:2px; }
  .cal-cell{
    background:var(--surface); border:1px solid var(--border); border-radius:12px; min-height:88px;
    padding:6px; display:flex; flex-direction:column; gap:4px; cursor:pointer; transition:border-color .15s;
  }
  .cal-cell:hover{ border-color:var(--border-strong); }
  .cal-cell.muted{ opacity:.35; }
  .cal-cell.today{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset, 0 0 18px -4px rgba(236,159,46,.5); }
  .cal-cell.selected{ background:var(--accent-soft); }
  .cal-daynum{ font-size:12px; color:var(--ink-2); font-weight:700; }
  .cal-chip{ font-size:10.5px; background:var(--surface-2); border-radius:6px; padding:2px 6px; display:flex; align-items:center; gap:4px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .cal-chip .dot{ width:6px; height:6px; border-radius:50%; flex:none; }
  .cal-more{ font-size:10.5px; color:var(--ink-muted); }

  .cal-week{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .cal-week .cal-cell{ min-height:220px; align-items:stretch; }

  .day-panel{
    width:280px; flex:none; background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:15px; position:sticky; top:82px;
  }
  .day-panel h3{ margin:0 0 12px; }
  .day-panel .card{ margin-bottom:8px; }

  /* ---------- Activity drawer ---------- */
  .drawer{
    width:300px; flex:none; border-left:1px solid var(--border); background:var(--surface);
    padding:18px; overflow-y:auto;
  }
  .drawer h3{ margin:0 0 14px; display:flex; align-items:center; gap:8px; }
  .activity-item{ display:flex; gap:9px; padding:10px 0; border-bottom:1px solid var(--border); }
  .activity-item:last-child{ border-bottom:none; }
  .activity-text{ font-size:12.5px; color:var(--ink-2); line-height:1.5; }
  .activity-text b{ color:var(--ink); font-weight:700; }
  .activity-time{ font-size:11px; color:var(--ink-muted); margin-top:2px; }
  .activity-empty{ color:var(--ink-muted); font-size:12.5px; }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(4,3,2,.65); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;
  }
  .modal{
    background:var(--surface); border-radius:20px; width:100%; max-width:460px;
    max-height:88vh; overflow-y:auto; padding:24px; box-shadow:var(--shadow);
    border:1px solid var(--border-strong);
  }
  .modal h2{ font-size:21px; margin:0 0 18px; }
  .field{ margin-bottom:13px; display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); }
  .field .input, .field .select, .field .textarea{ width:100%; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .modal-actions{ display:flex; align-items:center; margin-top:20px; gap:8px; }
  .modal-actions .right{ display:flex; gap:8px; margin-left:auto; }


  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--gold-gradient); color:var(--accent-ink); font-size:13px; font-weight:600; padding:11px 20px;
    border-radius:999px; box-shadow:var(--shadow-gold); z-index:200; opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  .conn-banner{
    background:var(--status-review-bg); color:var(--gold-300); font-size:12.5px; font-weight:600;
    padding:8px 20px; text-align:center; position:relative; z-index:1;
  }

  /* ---------- List view ---------- */
  .list-wrap{ background:var(--surface-3); border:1px solid var(--border); border-radius:16px; overflow:hidden; }
  .list-row, .list-head{
    display:grid; grid-template-columns: 118px 1fr 150px 170px 24px 84px;
    align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--border);
  }
  .list-head{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-muted); background:var(--surface-2); }
  .list-row{ cursor:pointer; transition:background .15s; background:var(--surface); }
  .list-row:last-child{ border-bottom:none; }
  .list-row:hover{ background:var(--surface-2); }
  .list-row.overdue{ box-shadow: inset 3px 0 0 0 var(--danger); }
  .list-status{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--ink-2); }
  .list-title{ font-size:13.5px; font-weight:500; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .list-client{ font-size:12px; color:var(--ink-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .list-assignee{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-2); overflow:hidden; }
  .list-assignee-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .list-due{ font-size:12px; color:var(--ink-muted); }
  .list-due.overdue{ color:var(--danger); font-weight:700; }
  @media (max-width: 720px){
    .list-row, .list-head{ grid-template-columns: 90px 1fr 70px; }
    .list-client, .list-due{ display:none; }
  }

  /* ---------- Task preview ---------- */
  .preview-row{ margin-bottom:14px; }
  .preview-row:last-child{ margin-bottom:0; }
  .preview-row b{ display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); margin-bottom:5px; }
  .preview-row .prow-val{ display:flex; align-items:center; gap:7px; font-size:13.5px; color:var(--ink-2); }
  .preview-desc{ font-size:13.5px; line-height:1.65; color:var(--ink-2); white-space:pre-wrap; }
  .preview-links{ display:flex; flex-direction:column; gap:5px; }
  .preview-link{ font-size:12.5px; color:var(--gold-300); text-decoration:none; word-break:break-all; }
  .preview-link:hover{ text-decoration:underline; }
  .preview-meta{ font-size:11.5px; color:var(--ink-muted); margin-top:16px; border-top:1px solid var(--border); padding-top:12px; }
  .preview-badges{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }

  /* ---------- Responsive ---------- */
  @media (max-width: 860px){
    .drawer{ display:none; }
    .cal-wrap{ flex-direction:column; }
    .day-panel{ width:100%; position:static; }
  }
  @media (max-width: 480px){
    .topbar{ padding:10px 14px; }
    .content{ padding:16px 14px 32px; }
    .brand-divider, .brand .eyebrow{ display:none; }
    .who span.name{ display:none; }
  }
</style>
</head>
<body>

        <label>Prazo</label>

    </div>

      <label>Status</label>
      <select class="select" id="fStatus"></select>
    </div>

        <button class="btn btn-ghost" id="fCancel">Cancelar</button>

    </div>

  var EMAIL_NAMES = {
    'heric.arenars@gmail.com': 'Heric',
    'heryndigital@gmail.com': 'Kerylin'
  };
  function nameForEmail(email){
    var key = String(email||'').trim().toLowerCase();
    if (EMAIL_NAMES[key]) return EMAIL_NAMES[key];
    var prefix = key.split('@')[0].split(/[._-]+/)[0];
    return prefix ? prefix.charAt(0).toUpperCase() + prefix.slice(1) : 'Alguém';
  }

  // ---------- utils ----------
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function slugify(s){ return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'user'; }
  function todayISO(){ var d=new Date(); return fmtISO(d); }
  function fmtISO(d){ var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+dd; }
  function parseISO(s){ if(!s) return null; var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function fmtDateShort(s){ if(!s) return ''; var d=parseISO(s); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}); }
  function colorForName(name){
    var s = String(name||'?'); var h=0;
    for (var i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }
  function initials(name){
    var parts = String(name||'?').trim().split(/\s+/);
    if (!parts[0]) return '?';
    return (parts[0][0] + (parts[1]?parts[1][0]:'')).toUpperCase();
  }
  function statusMeta(id){ return STATUSES.filter(function(s){return s.id===id;})[0] || STATUSES[0]; }
  function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._h); toast._h = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }
  function relTime(iso){
    if(!iso) return '';
    var d = new Date(iso); var diff = (Date.now() - d.getTime())/1000;
    if (diff < 60) return 'agora há pouco';
    if (diff < 3600) return 'há ' + Math.floor(diff/60) + ' min';
    if (diff < 86400) return 'há ' + Math.floor(diff/3600) + 'h';
    if (diff < 86400*7) return 'há ' + Math.floor(diff/86400) + 'd';
    return d.toLocaleDateString('pt-BR');
  }

  // ---------- viewer identity ----------
  function avatarHTML(name, size){
    size = size || 26;
    var photo = AVATAR_PHOTOS[name];
    if (photo){
      return '<img class="avatar-img" style="width:'+size+'px;height:'+size+'px" src="'+photo+'" alt="'+esc(name)+'" title="'+esc(name)+'">';
    }
    var fs = Math.max(9, Math.round(size*0.42));
    return '<span class="avatar" style="width:'+size+'px;height:'+size+'px;font-size:'+fs+'px;background:'+colorForName(name)+'" title="'+esc(name||'?')+'">'+esc(initials(name))+'</span>';
  }
  function updateWhoUI(){
    var name = state.viewerName;
    $('whoName').textContent = name || '';
    $('whoAvatarSlot').innerHTML = avatarHTML(name || '?', 26);
  }
  function upsertMember(name){
    if (!db) return;
    var id = slugify(name);
    setDoc(doc(db,'members',id), { name: name, color: colorForName(name), updatedAt: new Date().toISOString() }).catch(function(){});
  }

  // ---------- db wiring ----------
  function logActivity(text, extra){
    if (!db) return;
    var body = Object.assign({ text: text, actor: state.viewerName || 'Alguém', ts: new Date().toISOString() }, extra||{});
    addDoc(collection(db,'activity'), body).then(function(){
      return getDocs(query(collection(db,'activity'), orderBy('ts','desc'), limit(61)));
    }).then(function(snap){
      if (snap.docs.length > 60){
        var oldest = snap.docs[snap.docs.length-1];
        deleteDoc(doc(db,'activity',oldest.id)).catch(function(){});
      }
    }).catch(function(){});
  }

  var unsubscribers = [];
  function startBoard(){
    unsubscribers.forEach(function(u){ u(); });
    unsubscribers = [];

    unsubscribers.push(onSnapshot(collection(db,'tasks'), function(snap){
      state.tasks = snap.docs.map(function(d){ var data = d.data() || {}; data.id = d.id; return data; });
      renderAll();
    }, function(err){
      toast('Conexão com o quadro caiu — atualize a página.');
    }));

    unsubscribers.push(onSnapshot(collection(db,'members'), function(snap){
      state.members = snap.docs.map(function(d){ return d.data() || {}; });
      renderAssigneeFilter(); renderMemberDatalist();
    }, function(){}));

    unsubscribers.push(onSnapshot(query(collection(db,'activity'), orderBy('ts','desc'), limit(30)), function(snap){
      state.activity = snap.docs.map(function(d){ return d.data() || {}; });
      renderActivity();
    }, function(){}));

    if (state.viewerName) upsertMember(state.viewerName);
  }
  function stopBoard(){
    unsubscribers.forEach(function(u){ u(); });
    unsubscribers = [];
    state.tasks = []; state.members = []; state.activity = [];
  }

  // ---------- rendering ----------
  function renderAll(){
    renderKanban();
    renderList();
    renderCalendar();
    renderActivity();
  }

  function filteredTasks(){
    if (!state.filterAssignee) return state.tasks;
    return state.tasks.filter(function(t){ return t.assignee === state.filterAssignee; });
  }

  function isOverdue(t){
    if (!t.dueDate || t.status === 'done') return false;
    return t.dueDate < todayISO();
  }

  function renderKanban(){
    var board = $('board'); board.innerHTML = '';
    var tasks = filteredTasks();
    $('kanbanCount').textContent = tasks.length + (tasks.length===1?' tarefa':' tarefas');

    STATUSES.forEach(function(st){
      var col = document.createElement('div');
      col.className = 'column';
      col.dataset.status = st.id;

      var head = document.createElement('div');
      head.className = 'column-head';
      var colTasks = tasks.filter(function(t){ return t.status === st.id; });
      head.innerHTML =
        '<span class="status-dot" style="background:var('+st.varc+')"></span>' +
        '<span class="column-title">'+esc(st.label)+'</span>' +
        '<span class="column-count">'+colTasks.length+'</span>';
      col.appendChild(head);

      if (!colTasks.length){
        var empty = document.createElement('div');
        empty.className = 'empty-col';
        empty.textContent = 'Sem tarefas';
        col.appendChild(empty);
      }

      colTasks.sort(function(a,b){ return (a.dueDate||'9999') < (b.dueDate||'9999') ? -1 : 1; });
      colTasks.forEach(function(t){ col.appendChild(renderCard(t, st.id)); });

      col.addEventListener('dragover', function(e){ e.preventDefault(); col.classList.add('dragover'); });
      col.addEventListener('dragleave', function(){ col.classList.remove('dragover'); });
      col.addEventListener('drop', function(e){
        e.preventDefault(); col.classList.remove('dragover');
        var id = e.dataTransfer.getData('text/plain');
        moveTask(id, st.id);
      });

      board.appendChild(col);
    });
  }

  function renderCard(t, currentStatus){
    var card = document.createElement('div');
    card.className = 'card' + (isOverdue(t) ? ' overdue' : '');
    card.draggable = true;
    card.dataset.id = t.id;

    var prio = PRIORITY[t.priority] || PRIORITY.media;
    var html = '';
    if (t.client) html += '<span class="card-tag">'+esc(t.client)+'</span>';
    html += '<div class="card-title">'+esc(t.title||'(sem título)')+'</div>';
    html += '<div class="card-foot">';
    if (t.assignee){
      html += avatarHTML(t.assignee, 20);
    }
    html += '<span class="prio-dot" style="background:'+prio.color+'" title="Prioridade '+prio.label+'"></span>';
    if (t.dueDate){
      html += '<span class="card-due'+(isOverdue(t)?' overdue':'')+'">📅 '+fmtDateShort(t.dueDate)+'</span>';
    }
    html += '<span class="spacer"></span>';
    html += '<select class="card-move mono" data-move="'+t.id+'">' + STATUSES.map(function(s){
      return '<option value="'+s.id+'"'+(s.id===currentStatus?' selected':'')+'>'+esc(s.label)+'</option>';
    }).join('') + '</select>';
    html += '</div>';
    card.innerHTML = html;

    card.addEventListener('dragstart', function(e){ e.dataTransfer.setData('text/plain', t.id); });
    card.addEventListener('click', function(e){
      if (e.target.closest('[data-move]')) return;
      openTaskPreview(t.id);
    });
    var moveSel = card.querySelector('[data-move]');
    moveSel.addEventListener('click', function(e){ e.stopPropagation(); });
    moveSel.addEventListener('change', function(e){ e.stopPropagation(); moveTask(t.id, moveSel.value); });

    return card;
  }

  function moveTask(id, newStatus){
    if (!db) return;
    var t = state.tasks.filter(function(x){return x.id===id;})[0];
    if (!t || t.status === newStatus) return;
    var from = statusMeta(t.status).label, to = statusMeta(newStatus).label;
    updateDoc(doc(db,'tasks',id), { status: newStatus, updatedAt: new Date().toISOString() }).then(function(){
      logActivity('moveu', { kind:'moved', taskTitle: t.title, from: from, to: to });
    }).catch(function(){ toast('Não deu para mover a tarefa.'); });
  }

  function renderAssigneeFilter(){
    var sel = $('filterAssignee');
    var current = sel.value;
    var names = {};
    state.members.forEach(function(m){ names[m.name]=1; });
    state.tasks.forEach(function(t){ if (t.assignee) names[t.assignee]=1; });
    var list = Object.keys(names).sort();
    sel.innerHTML = '<option value="">Todos os responsáveis</option>' + list.map(function(n){
      return '<option value="'+esc(n)+'">'+esc(n)+'</option>';
    }).join('');
    sel.value = list.indexOf(current) >= 0 ? current : '';
    state.filterAssignee = sel.value;
  }
  function renderMemberDatalist(){
    var dl = $('memberList');
    var names = {};
    state.members.forEach(function(m){ names[m.name]=1; });
    state.tasks.forEach(function(t){ if (t.assignee) names[t.assignee]=1; });
    dl.innerHTML = Object.keys(names).sort().map(function(n){ return '<option value="'+esc(n)+'">'; }).join('');
  }

  // ---------- list view ----------
  function renderList(){
    var wrap = $('listBody'); if (!wrap) return;
    var tasks = filteredTasks().slice().sort(function(a,b){
      var oa = STATUSES.map(function(s){return s.id;}).indexOf(a.status);
      var ob = STATUSES.map(function(s){return s.id;}).indexOf(b.status);
      if (oa !== ob) return oa - ob;
      return (a.dueDate||'9999') < (b.dueDate||'9999') ? -1 : 1;
    });
    $('listCount').textContent = tasks.length + (tasks.length===1?' tarefa':' tarefas');
    wrap.innerHTML = '';
    if (!tasks.length){
      wrap.innerHTML = '<div class="empty-col" style="border:none;padding:26px 10px;">Nenhuma tarefa por aqui.</div>';
      return;
    }
    tasks.forEach(function(t){ wrap.appendChild(renderListRow(t)); });
  }
  function renderListRow(t){
    var row = document.createElement('div');
    row.className = 'list-row' + (isOverdue(t) ? ' overdue' : '');
    row.dataset.id = t.id;
    var st = statusMeta(t.status);
    var prio = PRIORITY[t.priority] || PRIORITY.media;
    var html = '';
    html += '<span class="list-status"><span class="status-dot" style="background:var('+st.varc+')"></span>'+esc(st.label)+'</span>';
    html += '<span class="list-title">'+esc(t.title||'(sem título)')+'</span>';
    html += '<span class="list-client">'+(t.client?esc(t.client):'—')+'</span>';
    html += '<span class="list-assignee">'+(t.assignee ? avatarHTML(t.assignee,20)+'<span class="list-assignee-name">'+esc(t.assignee)+'</span>' : '—')+'</span>';
    html += '<span class="prio-dot" style="background:'+prio.color+'" title="Prioridade '+prio.label+'"></span>';
    html += '<span class="list-due'+(isOverdue(t)?' overdue':'')+'">'+(t.dueDate ? fmtDateShort(t.dueDate) : '—')+'</span>';
    row.innerHTML = html;
    row.addEventListener('click', function(){ openTaskPreview(t.id); });
    return row;
  }

  function renderActivity(){
    var box = $('activityList');
    if (!state.activity.length){ box.innerHTML = '<div class="activity-empty">Nada por aqui ainda.</div>'; return; }
    box.innerHTML = state.activity.map(function(a){
      var verb = a.text || 'fez algo em';
      var detail = '';
      if (a.kind === 'moved') detail = ' <b>'+esc(a.taskTitle)+'</b> de '+esc(a.from)+' para '+esc(a.to);
      else if (a.taskTitle) detail = ' <b>'+esc(a.taskTitle)+'</b>';
      return '<div class="activity-item">' +
        avatarHTML(a.actor, 22) +
        '<div><div class="activity-text"><b>'+esc(a.actor||'Alguém')+'</b> '+esc(verb)+detail+'</div>' +
        '<div class="activity-time mono">'+relTime(a.ts)+'</div></div></div>';
    }).join('');
  }

  // ---------- calendar ----------
  var DOW = ['seg','ter','qua','qui','sex','sáb','dom'];
  var MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

  function startOfWeekMon(d){
    var x = new Date(d); var day = (x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x;
  }

  function renderCalendar(){
    if (state.view !== 'calendar') return;
    var grid = $('calGrid');
    var tasks = filteredTasks();
    var byDate = {};
    tasks.forEach(function(t){ if (t.dueDate){ (byDate[t.dueDate] = byDate[t.dueDate]||[]).push(t); } });

    if (state.calMode === 'month'){
      var anchor = state.calAnchor;
      $('calLabel').textContent = cap(MONTHS[anchor.getMonth()]) + ' de ' + anchor.getFullYear();
      var firstOfMonth = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
      var gridStart = startOfWeekMon(firstOfMonth);
      var html = '<div class="cal-grid">';
      DOW.forEach(function(d){ html += '<div class="cal-dow">'+d+'</div>'; });
      for (var i=0;i<42;i++){
        var d = new Date(gridStart); d.setDate(d.getDate()+i);
        var iso = fmtISO(d);
        var muted = d.getMonth() !== anchor.getMonth();
        var isToday = iso === todayISO();
        var isSel = iso === state.selectedDay;
        var dayTasks = byDate[iso] || [];
        html += '<div class="cal-cell'+(muted?' muted':'')+(isToday?' today':'')+(isSel?' selected':'')+'" data-day="'+iso+'">';
        html += '<div class="cal-daynum">'+d.getDate()+'</div>';
        dayTasks.slice(0,3).forEach(function(t){
          html += '<div class="cal-chip" data-task="'+t.id+'"><span class="dot" style="background:'+colorForName(t.assignee||'?')+'"></span>'+esc(t.title)+'</div>';
        });
        if (dayTasks.length > 3) html += '<div class="cal-more">+'+(dayTasks.length-3)+' mais</div>';
        html += '</div>';
      }
      html += '</div>';
      grid.innerHTML = html;
    } else {
      var wk = startOfWeekMon(state.calAnchor);
      var wkEnd = new Date(wk); wkEnd.setDate(wkEnd.getDate()+6);
      $('calLabel').textContent = wk.getDate()+' '+cap(MONTHS[wk.getMonth()].slice(0,3))+' – '+wkEnd.getDate()+' '+cap(MONTHS[wkEnd.getMonth()].slice(0,3));
      var html2 = '<div class="cal-week">';
      for (var j=0;j<7;j++){
        var d2 = new Date(wk); d2.setDate(d2.getDate()+j);
        var iso2 = fmtISO(d2);
        var isToday2 = iso2 === todayISO();
        var isSel2 = iso2 === state.selectedDay;
        var dayTasks2 = byDate[iso2] || [];
        html2 += '<div class="cal-cell'+(isToday2?' today':'')+(isSel2?' selected':'')+'" data-day="'+iso2+'">';
        html2 += '<div class="cal-daynum">'+DOW[j]+' '+d2.getDate()+'</div>';
        dayTasks2.forEach(function(t){
          html2 += '<div class="cal-chip" data-task="'+t.id+'"><span class="dot" style="background:'+colorForName(t.assignee||'?')+'"></span>'+esc(t.title)+'</div>';
        });
        html2 += '</div>';
      }
      html2 += '</div>';
      grid.innerHTML = html2;
    }

    grid.querySelectorAll('[data-task]').forEach(function(el){
      el.addEventListener('click', function(e){ e.stopPropagation(); openTaskPreview(el.dataset.task); });
    });
    grid.querySelectorAll('[data-day]').forEach(function(el){
      el.addEventListener('click', function(){ selectDay(el.dataset.day, byDate[el.dataset.day]||[]); });
    });

    if (state.selectedDay) selectDay(state.selectedDay, byDate[state.selectedDay]||[]);
  }

  function selectDay(iso, tasks){
    state.selectedDay = iso;
    var d = parseISO(iso);
    $('dayPanelTitle').textContent = d.toLocaleDateString('pt-BR', {weekday:'long', day:'2-digit', month:'long'});
    var body = $('dayPanelBody');
    if (!tasks.length){
      body.innerHTML = '<p style="margin:0 0 10px;">Nenhuma tarefa neste dia.</p><button class="btn btn-primary" id="dayAdd" style="width:100%;">+ Nova tarefa</button>';
    } else {
      body.innerHTML = '';
      tasks.forEach(function(t){ body.appendChild(renderCard(t, t.status)); });
      var addBtn = document.createElement('button');
      addBtn.className = 'btn btn-ghost'; addBtn.style.width='100%'; addBtn.textContent = '+ Nova tarefa neste dia';
      addBtn.id = 'dayAdd';
      body.appendChild(addBtn);
    }
    document.querySelectorAll('.cal-cell').forEach(function(c){ c.classList.toggle('selected', c.dataset.day===iso); });
    var addBtn2 = $('dayAdd');
    if (addBtn2) addBtn2.addEventListener('click', function(){ openTaskModal(null, iso); });
  }

  // ---------- task modal ----------
  function openTaskModal(id, prefillDate){
    state.editingId = id;
    var fStatusSel = $('fStatus');
    fStatusSel.innerHTML = STATUSES.map(function(s){ return '<option value="'+s.id+'">'+esc(s.label)+'</option>'; }).join('');

    if (id){
      var t = state.tasks.filter(function(x){return x.id===id;})[0];
      if (!t) return;
      $('taskModalTitle').textContent = 'Editar tarefa';
      $('fTitle').value = t.title || '';
      $('fDesc').value = t.description || '';
      $('fLinks').value = t.links || '';
      $('fClient').value = t.client || '';
      $('fAssignee').value = t.assignee || '';
      $('fDue').value = t.dueDate || '';
      $('fPriority').value = t.priority || 'media';
      fStatusSel.value = t.status || 'todo';
      $('fDelete').style.display = 'inline-flex';
    } else {
      $('taskModalTitle').textContent = 'Nova tarefa';
      $('fTitle').value = '';
      $('fDesc').value = '';
      $('fLinks').value = '';
      $('fClient').value = '';
      $('fAssignee').value = state.viewerName || '';
      $('fDue').value = prefillDate || '';
      $('fPriority').value = 'media';
      fStatusSel.value = 'todo';
      $('fDelete').style.display = 'none';
    }
    $('taskOverlay').hidden = false;
    setTimeout(function(){ $('fTitle').focus(); }, 30);
  }
  function closeTaskModal(){ $('taskOverlay').hidden = true; state.editingId = null; }

  // ---------- task preview (read-only) ----------
  function parseLinks(raw){
    return String(raw||'').split(/\n|,/).map(function(s){ return s.trim(); }).filter(Boolean);
  }
  function openTaskPreview(id){
    var t = state.tasks.filter(function(x){return x.id===id;})[0];
    if (!t) return;
    state.previewId = id;
    var st = statusMeta(t.status);
    var prio = PRIORITY[t.priority] || PRIORITY.media;
    var html = '';
    html += '<div class="preview-badges">';
    if (t.client) html += '<span class="card-tag">'+esc(t.client)+'</span>';
    html += '<span class="list-status"><span class="status-dot" style="background:var('+st.varc+')"></span>'+esc(st.label)+'</span>';
    html += '<span class="list-status"><span class="prio-dot" style="background:'+prio.color+'"></span>Prioridade '+esc(prio.label)+'</span>';
    html += '</div>';
    html += '<h2 style="margin-top:0;">'+esc(t.title||'(sem título)')+'</h2>';
    html += '<div class="preview-row"><b>Responsável</b><div class="prow-val">'+(t.assignee ? avatarHTML(t.assignee,22)+esc(t.assignee) : '<span style="color:var(--ink-muted)">Ninguém ainda</span>')+'</div></div>';
    html += '<div class="preview-row"><b>Prazo</b><div class="prow-val">'+(t.dueDate ? '📅 '+fmtDateShort(t.dueDate)+(isOverdue(t)?' · <span style="color:var(--danger); font-weight:700;">atrasada</span>':'') : '<span style="color:var(--ink-muted)">Sem prazo</span>')+'</div></div>';
    html += '<div class="preview-row"><b>Descrição</b><div class="preview-desc">'+(t.description ? esc(t.description) : '<span style="color:var(--ink-muted)">Sem descrição.</span>')+'</div></div>';
    var links = parseLinks(t.links);
    if (links.length){
      html += '<div class="preview-row"><b>Links / Anexos</b><div class="preview-links">'+links.map(function(u){
        return '<a href="'+esc(u)+'" target="_blank" rel="noopener" class="preview-link">📎 '+esc(u)+'</a>';
      }).join('')+'</div></div>';
    }
    html += '<div class="preview-meta">Criada por '+esc(t.createdBy||'—')+(t.createdAt ? ' · '+relTime(t.createdAt) : '')+'</div>';
    $('previewBody').innerHTML = html;
    $('previewOverlay').hidden = false;
  }
  function closeTaskPreview(){ $('previewOverlay').hidden = true; state.previewId = null; }

  function saveTask(){
    if (!db){ toast('Sem conexão com o quadro agora.'); return; }
    var title = $('fTitle').value.trim();
    if (!title){ $('fTitle').focus(); return; }
    var body = {
      title: title,
      description: $('fDesc').value.trim(),
      links: $('fLinks').value.trim(),
      client: $('fClient').value.trim(),
      assignee: $('fAssignee').value.trim(),
      dueDate: $('fDue').value || null,
      priority: $('fPriority').value,
      status: $('fStatus').value,
      updatedAt: new Date().toISOString()
    };
    if (body.assignee) upsertMember(body.assignee);

    if (state.editingId){
      updateDoc(doc(db,'tasks',state.editingId), body).then(function(){
        logActivity('atualizou', { taskTitle: title });
        toast('Tarefa atualizada.');
        closeTaskModal();
      }).catch(function(){ toast('Não deu para salvar.'); });
    } else {
      body.createdAt = new Date().toISOString();
      body.createdBy = state.viewerName || 'Alguém';
      addDoc(collection(db,'tasks'), body).then(function(){
        logActivity('criou', { taskTitle: title });
        toast('Tarefa criada.');
        closeTaskModal();
      }).catch(function(){ toast('Não deu para criar a tarefa.'); });
    }
  }
  function deleteTask(){
    if (!db || !state.editingId) return;
    var t = state.tasks.filter(function(x){return x.id===state.editingId;})[0];
    if (!confirm('Excluir "'+(t?t.title:'')+'"? Essa ação não pode ser desfeita.')) return;
    deleteDoc(doc(db,'tasks',state.editingId)).then(function(){
      logActivity('excluiu', { taskTitle: t ? t.title : '' });
      toast('Tarefa excluída.');
      closeTaskModal();
    }).catch(function(){ toast('Não deu para excluir.'); });
  }

  // ---------- events ----------
  function wire(){
    $('viewSeg').addEventListener('click', function(e){
      var b = e.target.closest('button[data-view]'); if (!b) return;
      state.view = b.dataset.view;
      document.querySelectorAll('#viewSeg button').forEach(function(x){ x.classList.toggle('active', x===b); });
      $('kanbanView').style.display = state.view==='kanban' ? '' : 'none';
      $('listView').style.display = state.view==='list' ? '' : 'none';
      $('calendarView').style.display = state.view==='calendar' ? '' : 'none';
      if (state.view==='calendar') renderCalendar();
      if (state.view==='list') renderList();
    });
    $('calSeg').addEventListener('click', function(e){
      var b = e.target.closest('button[data-cal]'); if (!b) return;
      state.calMode = b.dataset.cal;
      document.querySelectorAll('#calSeg button').forEach(function(x){ x.classList.toggle('active', x===b); });
      renderCalendar();
    });
    $('calPrev').addEventListener('click', function(){ shiftCal(-1); });
    $('calNext').addEventListener('click', function(){ shiftCal(1); });
    $('calToday').addEventListener('click', function(){ state.calAnchor = new Date(); renderCalendar(); });

    $('filterAssignee').addEventListener('change', function(){ state.filterAssignee = this.value; renderAll(); });

    $('newTaskBtn').addEventListener('click', function(){ openTaskModal(null, state.view==='calendar' ? state.selectedDay : null); });
    $('fCancel').addEventListener('click', closeTaskModal);
    $('fSave').addEventListener('click', saveTask);
    $('fDelete').addEventListener('click', deleteTask);
    $('taskOverlay').addEventListener('click', function(e){ if (e.target.id==='taskOverlay') closeTaskModal(); });

    $('pClose').addEventListener('click', closeTaskPreview);
    $('pEdit').addEventListener('click', function(){
      var id = state.previewId;
      closeTaskPreview();
      openTaskModal(id);
    });
    $('previewOverlay').addEventListener('click', function(e){ if (e.target.id==='previewOverlay') closeTaskPreview(); });

    $('themeToggle').addEventListener('click', function(){
      var cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      applyTheme(cur === 'light' ? 'dark' : 'light');
    });

    $('activityToggle').addEventListener('click', function(){
      var d = $('drawer');
      var shown = getComputedStyle(d).display !== 'none';
      d.style.display = shown ? 'none' : 'block';
    });

    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape'){ closeTaskModal(); closeTaskPreview(); }
    });
  }

  // ---------- theme ----------
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    var btn = $('themeToggle');
    if (btn) btn.textContent = t === 'light' ? '🌙' : '☀️';
    try{ localStorage.setItem(LS_THEME, t); }catch(e){}
  }
  function initTheme(){
    var saved = null;
    try{ saved = localStorage.getItem(LS_THEME); }catch(e){}
    applyTheme(saved === 'light' ? 'light' : 'dark');
  }

  function shiftCal(dir){
    var a = new Date(state.calAnchor);
    if (state.calMode === 'month') a.setMonth(a.getMonth()+dir);
    else a.setDate(a.getDate()+dir*7);
    state.calAnchor = a;
    renderCalendar();
  }

  // ---------- auth ----------
  function showLogin(){
    $('loginScreen').hidden = false;
    $('appRoot').hidden = true;
  }
  function showApp(){
    $('loginScreen').hidden = true;
    $('appRoot').hidden = false;
  }
  function loginErrorMessage(code){
    if (code === 'auth/invalid-email') return 'E-mail inválido.';
    if (code === 'auth/user-disabled') return 'Esta conta foi desativada.';
    if (code === 'auth/invalid-credential' || code === 'auth/wrong-password' || code === 'auth/user-not-found') return 'E-mail ou senha incorretos.';
    if (code === 'auth/too-many-requests') return 'Muitas tentativas — aguarde um pouco e tente de novo.';
    return 'Não foi possível entrar. Tente novamente.';
  }
  function handleLogin(e){
    e.preventDefault();
    var email = $('loginEmail').value.trim();
    var pass = $('loginPassword').value;
    var errBox = $('loginError'); errBox.hidden = true;
    var btn = $('loginSubmit'); btn.disabled = true; btn.textContent = 'Entrando…';
    signInWithEmailAndPassword(auth, email, pass).catch(function(err){
      errBox.textContent = loginErrorMessage(err && err.code);
      errBox.hidden = false;
    }).finally(function(){
      btn.disabled = false; btn.textContent = 'Entrar no quadro';
    });
  }
  function handleLogout(){
    stopBoard();
    signOut(auth);
  }

  // ---------- boot ----------
  function boot(){
    initTheme();
    wire();
    $('loginForm').addEventListener('submit', handleLogin);
    $('logoutBtn').addEventListener('click', handleLogout);
    renderAll();

    onAuthStateChanged(auth, function(user){
      if (user){
        state.viewerName = nameForEmail(user.email);
        updateWhoUI();
        showApp();
        startBoard();
      } else {
        state.viewerName = null;
        stopBoard();
        showLogin();
      }
    });
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
</script>
</body>
</html>
